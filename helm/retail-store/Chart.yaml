apiVersion: v2
name: bedrock-retail-store
description: >-
  Project Bedrock deployment of the AWS Retail Store Sample Application,
  with the in-cluster data layer replaced by managed AWS services.
type: application
version: 1.0.0
appVersion: "1.6.2"

dependencies:
  - name: retail-store-sample-catalog-chart
    alias: catalog
    version: 1.6.2
    repository: oci://public.ecr.aws/aws-containers
  - name: retail-store-sample-cart-chart
    alias: cart
    version: 1.6.2
    repository: oci://public.ecr.aws/aws-containers
  - name: retail-store-sample-orders-chart
    alias: orders
    version: 1.6.2
    repository: oci://public.ecr.aws/aws-containers
  - name: retail-store-sample-checkout-chart
    alias: checkout
    version: 1.6.2
    repository: oci://public.ecr.aws/aws-containers
  - name: retail-store-sample-ui-chart
    alias: ui
    version: 1.6.2
    repository: oci://public.ecr.aws/aws-containers
